<!DOCTYPE html>
<html>
<head>
  <title>Settings - RentEdge</title>
  <link rel="icon" href="/icons8-house-32.png" type="image/x-icon"/>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #4CAF50;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
    }

    .navbar-left {
      font-weight: bold;
    }

    .navbar-right {
      position: relative;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      border: none;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
    }

    .dropbtn:hover {
      background-color: #45a049;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 8px;
      overflow: hidden;
    }

    .dropdown-content a,
    .dropdown-content button.logout-link {
      color: #333;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      background: none;
      border: none;
      text-align: left;
      width: 100%;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .dropdown-content a:hover,
    .dropdown-content button.logout-link:hover {
      background-color: #f1f1f1;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .dashboard-container {
      max-width: 600px;
      margin: 60px auto;
      padding: 40px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      font-size: 32px;
      color: #333;
      margin-bottom: 30px;
      text-align: center;
    }

    label {
      font-size: 18px;
      display: block;
      margin-top: 20px;
      color: #444;
    }

    select, input[type="time"], input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 6px;
      box-sizing: border-box;
    }

    .frequency-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .freq-btn {
      padding: 10px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f5f5f5;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
    }

    .freq-btn.selected,
    .freq-btn:hover {
      background-color: #4CAF50;
      color: white;
      border-color: #4CAF50;
    }

    .footer {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 14px;
      position: static;
      width: 100%;
    }

    #save-report-btn {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    #save-report-btn:hover {
      background-color: #0d6efd;
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="navbar">
      <div class="navbar-left">🏠 RentEdge</div>
      <div class="navbar-right">
        <div class="dropdown">
          <button class="dropbtn">Menu ▾</button>
          <div class="dropdown-content">
            <a href="/dashboard.html">Dashboard</a>
            <form id="logout-form" action="/logout" method="GET" style="margin: 0;">
              <button type="submit" class="logout-link">Logout</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="content">
      <div class="dashboard-container">
        <h2>📬 Schedule Your Report</h2>
        <label>Frequency:</label>
        <div class="frequency-group">
          <button type="button" class="freq-btn selected" data-value="daily">Daily</button>
          <button type="button" class="freq-btn" data-value="weekly">Weekly</button>
          <button type="button" class="freq-btn" data-value="monthly">Monthly</button>
          <button type="button" class="freq-btn" data-value="none">None</button>
        </div>
        <div id="day-selector" style="display: none;">
          <label for="day">Send on:</label>
          <select id="day" name="day">
            <option value="">-- Select Day --</option>
            <option value="Sunday">Sunday</option>
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
          </select>
        </div>
        <div id="day-of-month-selector" style="display: none;">
          <label for="monthDay">Send on day of the month:</label>
          <select id="monthDay" name="monthDay">
            <option value="">-- Select Day --</option>
            <option value="last">Last day of month</option>
          </select>
        </div>
        <label for="time">Time:</label>
        <input type="time" id="time" name="time" required />
        <label for="recipients">Additional Recipients (comma-separated):</label>
        <input type="text" id="recipients" placeholder="example1@email.com, example2@email.com" />
        <button id="save-report-btn">💾 Save Settings</button>
      </div>
    </div>
    <footer class="footer">
      © 2025 RentEdge. All rights reserved.
    </footer>
  </div>
<script>
  let selectedFrequency = "daily";
  const monthDaySelect = document.getElementById("monthDay");
  for (let i = 1; i <= 31; i++) {
    const option = document.createElement("option");
    option.value = i;
    option.text = i;
    monthDaySelect.appendChild(option);
  }
  document.querySelectorAll(".freq-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".freq-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedFrequency = btn.dataset.value;
      document.getElementById("day-selector").style.display = selectedFrequency === "weekly" ? "block" : "none";
      document.getElementById("day-of-month-selector").style.display = selectedFrequency === "monthly" ? "block" : "none";
    });
  });
  async function loadUserSchedule() {
    try {
      const response = await fetch("/api/reporting/get");
      const result = await response.json();
      console.log("📥 Schedule data received:", result);
      if (!response.ok) throw new Error(result.error || "Failed to load schedule");
      const { frequency, day_of_week, day_of_month, time_of_day, additional_recipients } = result;
      console.log(JSON.stringify(req.body, null, 2));
      if (frequency) {
        document.querySelectorAll(".freq-btn").forEach(btn => {
          btn.classList.remove("selected");
          if (btn.dataset.value === frequency) {
            btn.classList.add("selected");
            selectedFrequency = frequency;
          }
        });
        document.getElementById("day-selector").style.display = frequency === "weekly" ? "block" : "none";
        document.getElementById("day-of-month-selector").style.display = frequency === "monthly" ? "block" : "none";
      }
      if (day_of_week) document.getElementById("day").value = day_of_week;
      if (day_of_month !== null) document.getElementById("monthDay").value = day_of_month === 31 ? "last" : String(day_of_month);
      if (time_of_day) document.getElementById("time").value = time_of_day.slice(0, 5);
      if (additional_recipients) {
        const recipientArray = Array.isArray(additional_recipients)
          ? additional_recipients
          : additional_recipients.split(',').map(r => r.trim());

        document.getElementById("recipients").value = recipientArray.join(', ');
}
    } catch (err) {
      console.error("Failed to load existing schedule:", err);
    }
  }
  document.getElementById("save-report-btn").addEventListener("click", async () => {
  const day = document.getElementById("day").value || null;
  const monthDayRaw = document.getElementById("monthDay").value || null;
  const dayOfMonth = (monthDayRaw === "last") ? 31 : parseInt(monthDayRaw) || null;
  const time = document.getElementById("time").value;
  const recipientsRaw = document.getElementById("recipients").value.trim();
  const recipientArray = recipientsRaw ? recipientsRaw.split(',').map(r => r.trim()) : [];

  if (selectedFrequency !== "none" && !time) return alert("Please select a time.");

  try {
    const response = await fetch("/api/reporting/schedule", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        frequency: selectedFrequency,
        day_of_week: selectedFrequency === "weekly" ? day : null,
        day_of_month: selectedFrequency === "monthly" ? dayOfMonth : null,
        time_of_day: time + ":00",
        additional_recipients: recipientArray
      })
    });
    const result = await response.json();
    if (response.ok) {
      alert("✅ Schedule saved!");
    } else {
      alert("❌ " + result.error);
    }
  } catch (err) {
    console.error(err);
    alert("⚠️ Could not save schedule.");
  }
});
  loadUserSchedule();
</script>
</body>
</html>
