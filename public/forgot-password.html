<!DOCTYPE html>
<html lang="en">
<head>
  <title>Forgot Password</title>
  <link rel="icon" href="/icons8-house-32.png" type="image/x-icon" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #4CAF50;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
    }

    .navbar-left {
      font-weight: bold;
    }

    .navbar-right a {
      color: white;
      background-color: #4CAF50;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .navbar-right a:hover {
      background-color: #4CAF50;
    }

    .dashboard-container {
      max-width: 500px;
      margin: 60px auto;
      padding: 40px;
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 {
      font-size: 28px;
      color: #333;
      margin-bottom: 20px;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: darkblue;
    }

    #message {
      margin-top: 20px;
      font-size: 16px;
      color: #e53935;
    }

    .footer {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="navbar">
      <div class="navbar-left">🏠 RentEdge</div>
      <div class="navbar-right">
        <a href="/login.html">Login</a>
      </div>
    </div>

    <div class="dashboard-container">
      <h2>Reset Your Password</h2>
      <form id="requestForm">
        <input type="email" name="email" placeholder="Enter your email" required />
        <button type="submit">Request Password Reset</button>
      </form>
      <p id="message"></p>
    </div>
  </div>

  <footer class="footer">
    © 2025 RentEdge. All rights reserved.
  </footer>

  <script>
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = e.target.email.value;

      const res = await fetch('/request-password-reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();
      document.getElementById('message').textContent = data.message || data.error;
    });
  </script>
</body>
</html>
