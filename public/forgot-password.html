<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      text-align: center;
      padding: 40px;
    }

    .container {
      max-width: 400px;
      margin: auto;
      background-color: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Your Password</h2>
    <form id="resetForm">
    <input
      type="password"
      name="newPassword"
      placeholder="Enter your new password"
      required
    />
    <button type="submit">Reset Password</button>
  </form>
    <p id="message"></p>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      // Get new password from form input
      const newPassword = e.target.newPassword.value;

      // Get token from URL query string (?token=xyz)
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('message').textContent = 'Missing or invalid reset token.';
        return;
      }

      try {
        const res = await fetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: token,
            newPassword: newPassword
          })
        });

        const result = await res.json();

        if (res.ok) {
          document.getElementById('message').textContent = result.message || 'Password reset successfully!';
        } else {
          document.getElementById('message').textContent = result.error || 'Failed to reset password.';
        }
      } catch (error) {
        console.error('Error:', error);
        document.getElementById('message').textContent = 'An error occurred. Please try again.';
      }
    });
  </script>
</body>
</html>
