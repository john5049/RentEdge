<!DOCTYPE html>
<html lang="en">
<head><title>Reset Password</title></head>
<body>
  <h2>Reset Password</h2>
  <form id="resetForm">
    <input type="password" name="newPassword" placeholder="New password" required minlength="6" />
    <button type="submit">Reset Password</button>
  </form>
  <p id="message"></p>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = e.target.newPassword.value;
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('message').textContent = 'Missing or invalid reset token.';
        return;
      }

      const res = await fetch('/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });

      const data = await res.json();
      document.getElementById('message').textContent = data.message || data.error || 'An error occurred.';
    });
  </script>
</body>
</html>
