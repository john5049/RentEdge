<!DOCTYPE html>
<html lang="en">
<head>
  <title>Reset Password</title>
  <link rel="icon" href="/icons8-house-32.png" type="image/x-icon" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .page-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #4CAF50;
      color: white;
      padding: 15px 30px;
      font-size: 20px;
    }

    .navbar-left {
      font-weight: bold;
    }

    .dashboard-container {
      max-width: 800px;
      margin: 60px auto;
      padding: 40px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      font-size: 18px;
      font-style: italic;
      display: block;
      margin-top: 20px;
      text-align: left;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 6px;
    }

    .login-button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      background-color: blue;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .login-button:hover {
      background-color: darkblue;
    }

    .message {
      margin-top: 20px;
      font-size: 16px;
      color: #e53935;
    }

    .footer {
      background-color: #4CAF50;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="navbar">
      <div class="navbar-left">🏠 RentWise</div>
    </div>

    <div class="dashboard-container">
      <h1>Reset Your Password</h1>
      <form id="resetForm">
        <label>New Password:</label>
        <input type="password" name="newPassword" required minlength="6" />
        <button class="login-button" type="submit">Reset Password</button>
      </form>
      <div class="message" id="message"></div>
    </div>
  </div>

  <footer class="footer">
    © 2025 RentEdge. All rights reserved.
  </footer>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newPassword = e.target.newPassword.value;
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        document.getElementById('message').textContent = 'Missing or invalid reset token.';
        return;
      }

      const res = await fetch('/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });

      const data = await res.json();
      document.getElementById('message').textContent = data.message || data.error || 'An error occurred.';
    });
  </script>
</body>
</html>
